name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Backend branch/tag"
        required: true
        default: "main"
        type: string

      frontend_ref:
        description: "Frontend branch/tag"
        required: true
        default: "main"
        type: string

  push:
    branches:
      - main

    tags:
      - "v*"


permissions:
  contents: read
  packages: write


concurrency:
  group: coolkid-rss-docker
  cancel-in-progress: false


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coolkids/coolkid-rss


jobs:
  build:
    name: Build Docker
    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # Checkout
      # ===================================================

      - name: Checkout
        uses: actions/checkout@v6


      # ===================================================
      # Buildx
      # ===================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # ===================================================
      # Login GHCR
      # ===================================================

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ===================================================
      # Metadata
      # ===================================================

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

            type=ref,event=tag

            type=sha,prefix=sha-

            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}


      # ===================================================
      # Resolve refs
      # ===================================================

      - name: Resolve source refs
        id: refs
        shell: bash
        run: |
          BACKEND_REF="${{ inputs.backend_ref }}"
          FRONTEND_REF="${{ inputs.frontend_ref }}"

          if [ -z "$BACKEND_REF" ]; then
            BACKEND_REF="main"
          fi

          if [ -z "$FRONTEND_REF" ]; then
            FRONTEND_REF="main"
          fi

          echo "backend_ref=$BACKEND_REF" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=$FRONTEND_REF" >> "$GITHUB_OUTPUT"

          echo "Backend:  $BACKEND_REF"
          echo "Frontend: $FRONTEND_REF"


      # ===================================================
      # Build
      # ===================================================

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          platforms: |
            linux/amd64

          push: true

          build-args: |
            BACKEND_REF=${{ steps.refs.outputs.backend_ref }}
            FRONTEND_REF=${{ steps.refs.outputs.frontend_ref }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max