[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid


[program:backend]
command=/bin/sh -c "exec java $JAVA_OPTS -jar /app/coolkid-rss.jar"
directory=/app

autostart=true
autorestart=true

startsecs=5
startretries=3

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

stopasgroup=true
killasgroup=true

priority=10


[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"

autostart=true
autorestart=true

startsecs=2
startretries=3

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

stopasgroup=true
killasgroup=true

priority=20